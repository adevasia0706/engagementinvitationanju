<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation Tracker</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--text:#2b2118;--muted:#7a6a5b;--line:#eadfce;--accent:#b5472f;--ok:#2e7d4f;--okbg:#e3f3e9;--pend:#b36b00;--pendbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#272019;--text:#f5ebde;--muted:#b3a290;--line:#3a3027;--accent:#e8856c;--ok:#7fd3a0;--okbg:#1d3a2a;--pend:#f0b960;--pendbg:#3d2e10}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#272019;--text:#f5ebde;--muted:#b3a290;--line:#3a3027;--accent:#e8856c;--ok:#7fd3a0;--okbg:#1d3a2a;--pend:#f0b960;--pendbg:#3d2e10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:28px}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:var(--ok);width:0;transition:width .3s}
.add{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
input{width:100%;font:inherit;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:8px}
.btn{width:100%;font:inherit;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;font:inherit;font-size:16px;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.guest{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.main{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.note{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.status{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:999px;padding:12px 14px;min-width:96px;cursor:pointer}
.status.pending{background:var(--pendbg);color:var(--pend)}
.status.done{background:var(--okbg);color:var(--ok)}
.del{font:inherit;font-size:15px;border:0;background:none;color:var(--muted);padding:12px 8px;cursor:pointer}
.del.sure{color:#fff;background:#c0392b;border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.reset{display:block;margin:18px auto 0;font:inherit;font-size:15px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>💌 Invitation Tracker</h1>
  <p class="sub">Tap a name’s button when you have invited them.</p>

  <div class="stats">
    <div class="stat"><b id="nTotal">0</b><span>Total</span></div>
    <div class="stat"><b id="nDone">0</b><span>Invited</span></div>
    <div class="stat"><b id="nPend">0</b><span>Pending</span></div>
  </div>
  <div class="bar"><div id="prog"></div></div>

  <div class="add">
    <input id="nameIn" placeholder="Name (e.g. Suresh Uncle)" autocomplete="off">
    <input id="noteIn" placeholder="Note or phone (optional)" autocomplete="off">
    <button class="btn" id="addBtn">+ Add person</button>
  </div>

  <input id="search" placeholder="🔍 Search name">

  <div class="tabs">
    <button class="tab on" data-f="all">All</button>
    <button class="tab" data-f="pending">Pending</button>
    <button class="tab" data-f="done">Invited</button>
  </div>

  <div id="list"></div>
  <button class="reset" id="resetBtn">Clear everything</button>
</div>

<script>
var KEY="invite-tracker-v1", guests=[], filter="all", q="", sureId=null, sureReset=false;
function load(){try{var r=localStorage.getItem(KEY);if(r)guests=JSON.parse(r)||[];}catch(e){guests=[];}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(guests));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}

function render(){
  var done=guests.filter(function(g){return g.done}).length, total=guests.length;
  document.getElementById("nTotal").textContent=total;
  document.getElementById("nDone").textContent=done;
  document.getElementById("nPend").textContent=total-done;
  document.getElementById("prog").style.width=(total?Math.round(done/total*100):0)+"%";
  var shown=guests.filter(function(g){
    if(filter==="pending"&&g.done)return false;
    if(filter==="done"&&!g.done)return false;
    return !q||g.name.toLowerCase().indexOf(q)>-1;
  });
  var el=document.getElementById("list");
  if(!shown.length){
    el.innerHTML='<div class="empty">'+(total?'No one here.':'No one added yet. Add the first name above.')+'</div>';
  } else {
    el.innerHTML=shown.map(function(g){
      return '<div class="guest"><div class="main"><div class="name">'+esc(g.name)+'</div>'+
      (g.note?'<div class="note">'+esc(g.note)+'</div>':'')+'</div>'+
      '<button class="status '+(g.done?'done':'pending')+'" data-t="'+g.id+'">'+(g.done?'✓ Invited':'Pending')+'</button>'+
      '<button class="del'+(sureId===g.id?' sure':'')+'" data-d="'+g.id+'">'+(sureId===g.id?'Sure?':'✕')+'</button></div>';
    }).join("");
  }
  document.getElementById("resetBtn").textContent=sureReset?"Tap again to delete ALL":"Clear everything";
}

function add(){
  var n=document.getElementById("nameIn"), t=document.getElementById("noteIn");
  var name=n.value.trim(); if(!name){n.focus();return;}
  guests.unshift({id:Date.now()+Math.random(),name:name,note:t.value.trim(),done:false});
  n.value="";t.value="";save();render();n.focus();
}

document.getElementById("addBtn").onclick=add;
document.getElementById("nameIn").onkeydown=function(e){if(e.key==="Enter")document.getElementById("noteIn").focus();};
document.getElementById("noteIn").onkeydown=function(e){if(e.key==="Enter")add();};
document.getElementById("search").oninput=function(e){q=e.target.value.trim().toLowerCase();render();};
document.querySelectorAll(".tab").forEach(function(b){
  b.onclick=function(){filter=b.dataset.f;document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===b)});render();};
});
document.getElementById("list").onclick=function(e){
  var t=e.target.closest("[data-t]"), d=e.target.closest("[data-d]");
  if(t){var g=guests.find(function(x){return String(x.id)===t.dataset.t});if(g){g.done=!g.done;save();}sureId=null;render();}
  else if(d){
    var id=d.dataset.d;
    if(String(sureId)===id){guests=guests.filter(function(x){return String(x.id)!==id});sureId=null;save();}
    else{sureId=guests.find(function(x){return String(x.id)===id}).id;setTimeout(function(){sureId=null;render();},3000);}
    render();
  }
};
document.getElementById("resetBtn").onclick=function(){
  if(sureReset){guests=[];save();sureReset=false;}
  else{sureReset=true;setTimeout(function(){sureReset=false;render();},3000);}
  render();
};
load();render();
</script>
</body>
</html>
